name: Build AstraXR APK

# Roda automaticamente a cada push na main, e também pode ser
# disparado manualmente pela aba "Actions" no site/app do GitHub
# (botão "Run workflow").
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # O projeto não inclui o gradle-wrapper.jar binário (evitamos
      # comitar binários gerados). Esta action instala o Gradle
      # direto no runner, então usamos "gradle" em vez de "./gradlew".
      - name: Instalar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK debug
        run: gradle assembleDebug

      - name: Enviar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: AstraXR-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          
